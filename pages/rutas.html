<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoRutas - Ruta Específica</title>
  <link rel="stylesheet" href="../css/styles_actividades.css" />
  <link rel="stylesheet" href="../css/styles_rutas.css" />
</head>
<body>
  <header class="header-principal">
    <div class="logo"><span>EcoRutas</span></div>
    <nav class="nav-principal">
      <ul class="nav-lista">
        <li><a href="actividades.html">Volver a Actividades</a></li>
      </ul>
    </nav>
  </header>

  <main class="contenedor-principal">
    <!-- Contenedor donde aparecerá solo la ruta buscada -->
    <div id="detalle-ruta" class="contenedor-ruta-unica">
      <p>Cargando información de la ruta...</p>
    </div>
  </main>

  <!-- Cargamos tu archivo centralizado de datos -->
  <script src="../js/emprendimientos.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const contenedor = document.getElementById('detalle-ruta');

      const params = new URLSearchParams(window.location.search);
      const idBuscado = params.get('id');

      function construirSeccionGuia(ruta) {
        // Solo mostrar si la ruta requiere/recomienda guía y tiene datos de contacto
        if (!ruta.requiereGuia || !ruta.guia || !ruta.guia.nombre) {
          return "";
        }
        const nombreGuia = ruta.guia.nombre;
        const whatsapp = (ruta.guia.whatsapp || "").replace(/\D/g, "");
        const email = ruta.guia.email || "";
        const mensaje = encodeURIComponent(`Hola ${nombreGuia}, quiero hacer la ruta "${ruta.titulo}" con un guía. ¿Me das más información?`);
        const whatsappUrl = whatsapp ? `https://wa.me/${whatsapp}?text=${mensaje}` : "";
        const emailUrl = email ? `mailto:${email}?subject=${encodeURIComponent(`Ruta ${ruta.titulo} con guía`)}&body=${mensaje}` : "";

        let botones = "";
        if (whatsappUrl) {
          botones += `<a href="${whatsappUrl}" target="_blank" rel="noopener" class="btn-guia btn-whatsapp">Contactar por WhatsApp</a>`;
        }
        if (emailUrl) {
          botones += `<a href="${emailUrl}" class="btn-guia btn-email">Enviar correo</a>`;
        }
        if (!botones) {
          return "";
        }

        return `
            <section class="seccion-guia" aria-label="Contacto de guía turístico">
              <h2 class="titulo-guia">Haz esta ruta con un guía</h2>
              <p class="guia-descripcion">Esta ruta requiere o recomienda ir acompañado por seguridad y para una mejor experiencia.</p>
              <p class="guia-nombre"><strong>${nombreGuia}</strong></p>
              <div class="guia-botones">
                ${botones}
              </div>
            </section>
        `;
      }

      if (typeof listaEmprendimientos !== 'undefined' && idBuscado) {
        const rutaEncontrada = listaEmprendimientos.find(item => item.id === idBuscado);

        if (rutaEncontrada) {
          const seccionGuia = construirSeccionGuia(rutaEncontrada);
          contenedor.innerHTML = `
            <span class="etiqueta">${rutaEncontrada.etiqueta}</span>
            <h1 class="titulo-ruta-unica">${rutaEncontrada.titulo}</h1>
            <p><strong>Ubicación:</strong> ${rutaEncontrada.donde}</p>
            <p>${rutaEncontrada.descripcion}</p>
            
            <div class="detalles-extra-ruta">
              <p><strong>Nivel físico:</strong> ${rutaEncontrada.nivelFisico}</p>
              <p><strong>Equipamiento:</strong> ${rutaEncontrada.equipamiento}</p>
            </div>

            ${seccionGuia}

            <div class="mapa-embed-container">
              <h3>Mapa de ubicación y ruta:</h3>
              <iframe src="${rutaEncontrada.mapaUrl}" width="100%" height="400" class="mapa-iframe" allowfullscreen="" loading="lazy"></iframe>
            </div>
            
            <div class="contenedor-btn-volver">
              <a href="actividades.html" class="btn-volver-actividades">← Volver a Actividades</a>
            </div>
          `;
        } else {
          contenedor.innerHTML = `<h2>Ruta no encontrada</h2><p>Lo sentimos, la ruta que buscas no existe o fue removida.</p><a href="actividades.html">Volver</a>`;
        }
      } else {
        contenedor.innerHTML = `<h2>Ninguna ruta seleccionada</h2><p>Por favor, selecciona una actividad desde el mapa o la lista.</p><a href="actividades.html">Ver actividades</a>`;
      }
    });
  </script>
</body>
</html>
