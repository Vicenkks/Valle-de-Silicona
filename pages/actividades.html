<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecoruta - Actividades</title>
  <link rel="stylesheet" href="../css/styles_actividades.css" />
</head>

<body>
  <header class="header-principal">
    <div role="Complementary" class="header-top">
      <div role="Complementary" class="logo">
        <img src="../img/araucaria.png" alt="Logo araucaria EcoRutas" class="logo-img">
        <span><a href="../index.html" style="text-decoration: none; color: inherit;">EcoRutas</a></span>
      </div>

      <div role="Complementary" class="widget-clima" aria-label="Condiciones climáticas actuales">
        <img src="https://cdn-icons-png.flaticon.com/128/2948/2948175.png" alt="Nube de lluvia" class="icono-clima"
          aria-hidden="true" />
        <div role="Complementary" class="detalles-clima">
          <strong>Lluvioso en Temuco</strong><br />
          <span>15°C | Humedad 80%</span>
        </div>
      </div>
    </div>

    <nav aria-label="Navegación principal" class="nav-principal">
      <ul class="nav-lista">
        <li><a href="actividades.html">Actividades</a></li>
        <li><a href="ofertas.html">Ofertas</a></li>
        <li><a href="comunidad.html">Comunidad</a></li>
      </ul>

      <a href="#" class="profile-link" aria-label="Ir a tu perfil de usuario">
        <img src="https://i.pinimg.com/736x/87/26/89/872689ed230670a7cf0f33310a45b76d.jpg" alt="" class="img-perfil" />
      </a>
    </nav>
  </header>
<main class="contenedor-principal">
    <h1>Actividades en la Araucanía</h1>
    <p class="subtitulo">Explora por tipo de actividad y encuentra dónde vivirla.</p>

    <nav aria-label="Filtrar por tipo de actividad" class="filtros-actividades">
        <button type="button" class="filtro-btn activo" data-filtro="todas">Todas</button>
        <button type="button" class="filtro-btn" data-filtro="trekking">Trekking</button>
        <button type="button" class="filtro-btn" data-filtro="kayak">Kayak</button>
        <button type="button" class="filtro-btn" data-filtro="termas">Termas</button>
        <button type="button" class="filtro-btn" data-filtro="gastronomia">Gastronomía</button>
    </nav>

    <!-- Contenedor donde se generarán las tarjetas automáticamente -->
    <div class="contenido-actividades" id="contenedor-actividades"></div>

    <p id="sin-resultados" hidden>No hay actividades para este filtro.</p>
</main>

<!-- Cargas el archivo de datos y el script que genera las tarjetas -->
<script src="../js/emprendimientos.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const contenedor = document.getElementById('contenedor-actividades');

        if (typeof listaEmprendimientos !== 'undefined') {
            contenedor.innerHTML = "";

            listaEmprendimientos.forEach(item => {
                const article = document.createElement('article');
                article.className = 'tarjeta-actividad';
                article.setAttribute('data-categoria', item.categoria);
                article.id = item.id;
                article.innerHTML = `
                    <img src="${item.imagen}" alt="Fotografía de ${item.titulo}" class="img-actividad" />
                    <span class="etiqueta">${item.etiqueta}</span>
                    <h2>${item.titulo}</h2>
                    <p>${item.descripcion}</p>
                    <ul class="detalles-actividad">
                        <li><strong>Dónde:</strong> ${item.donde}</li>
                        <li><strong>Nivel físico:</strong> ${item.nivelFisico}</li>
                        <li><strong>Equipamiento recomendado:</strong> ${item.equipamiento}</li>
                    </ul>
                    <a href="rutas.html?id=${item.id}"class="btn-ruta">Ver ruta donde se realiza</a>
                `;

                contenedor.appendChild(article);
            });
        }
    });
</script>
<script src="../js/main.js" defer></script>
</body>

</html>
