<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoRutas - Panel de Administración (CRUD)</title>
  <link rel="stylesheet" href="../css/styles_actividades.css" />
  <link rel="stylesheet" href="../css/styles_admin.css" />
</head>
<body>
  <header class="header-principal">
    <div class="logo"><span>EcoRutas - Admin</span></div>
    <!-- <nav class="nav-principal">
      <ul class="nav-lista">
        <li><a href="rutas.html">Ver Rutas Públicas</a></li>
      </ul>
    </nav> -->
  </header>

  <main class="contenedor-principal admin-container">
    <!-- Migas de Pan (Breadcrumbs) para Panel de Administración -->
    <nav aria-label="Migas de pan" class="migas-pan">
        <ol class="lista-migas">
            <li><a href="../index.html">Inicio</a></li>
            <li aria-current="page">Administración</li>
        </ol>
    </nav>
    <h1>Gestión de Rutas (CRUD)</h1>

    <!-- Formulario para Crear / Actualizar -->
    <form id="formRuta" class="form-admin">
      <h3 id="form-titulo">Añadir Nueva Ruta</h3>
      <input type="hidden" id="rutaId">

      <label for="titulo">Título de la Ruta:</label>
      <input type="text" id="titulo" placeholder="Ej: Ruta Salto del Laja" required>

      <label for="ubicacion">Ubicación:</label>
      <input type="text" id="ubicacion" placeholder="Ej: Comuna de Yungay" required>

      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" rows="3" placeholder="Detalles de la experiencia..." required></textarea>

      <label for="mapaUrl">Enlace de inserción (Iframe `src` de Google Maps):</label>
      <input type="text" id="mapaUrl" placeholder="https://www.google.com/maps/embed?..." required>

      <div style="display: flex; gap: 10px;">
        <button type="submit" id="btnAccion" class="btn-guardar" style="flex: 1;">Guardar Ruta</button>
        <button type="button" id="btnCancelar" class="btn-cancelar" onclick="resetearFormulario()">Cancelar Edición</button>
      </div>
    </form>

    <!-- Tabla para Leer y Listar elementos existentes -->
    <div class="tabla-gestion">
      <h3>Rutas Registradas</h3>
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Ubicación</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-cuerpo">

        </tbody>
      </table>
    </div>
    <button type="button" id="btnExportar" class="btn-exportar">Descargar JSON actualizado</button>
  </main>
<script src="../js/emprendimientos.js"></script>
  <script>
    
    // Obtener datos del LocalStorage
    function obtenerRutas() {
      const guardadas = localStorage.getItem('ecoRutasLista');
      if (guardadas) {
        return JSON.parse(guardadas);
      } else {
        // Si el LocalStorage está vacío, cargamos directamente tu estructura original
        let datosIniciales = [];
        if (typeof listaEmprendimientos !== 'undefined') {
          datosIniciales = listaEmprendimientos.map(item => ({
            id: item.id,
            titulo: item.titulo,
            ubicacion: item.donde, // Mapeamos 'donde' a la ubicación que usa la tabla
            descripcion: item.descripcion,
            mapaUrl: item.mapaUrl || "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d98200!2d-71.65!3d-38.65!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x966119f18a66a15f%3A0x8e1a7b8e0e7a2b0!2sParque%20Nacional%20Conguill%C3%ADo!5e0!3m2!1ses!2scl!4v1700000000000"
          }));
        } else {
          console.error("No se encontró la variable listaEmprendimientos. Revisa la ruta del script.");
        }
        
        localStorage.setItem('ecoRutasLista', JSON.stringify(datosIniciales));
        return datosIniciales;
      }
    }
    // Guardar datos en el LocalStorage
    function guardarRutas(rutas) {
      localStorage.setItem('ecoRutasLista', JSON.stringify(rutas));
    }
    // --- LEER (READ): Mostrar las rutas en la tabla de administración ---
    function cargarTabla() {
      const cuerpoTabla = document.getElementById('tabla-cuerpo');
      const rutas = obtenerRutas();
      cuerpoTabla.innerHTML = "";

      rutas.forEach(ruta => {
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td><strong>${ruta.titulo}</strong></td>
          <td>${ruta.ubicacion}</td>
          <td>
            <div class="acciones-btns">
              <button class="btn-editar" onclick="prepararEdicion('${ruta.id}')">Editar</button>
              <button class="btn-eliminar" onclick="eliminarRuta('${ruta.id}')">Eliminar</button>
            </div>
          </td>
        `;
        cuerpoTabla.appendChild(fila);
      });
    }

    // --- CREAR (CREATE) y ACTUALIZAR (UPDATE) ---
    document.getElementById('formRuta').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const idExistente = document.getElementById('rutaId').value;
      const titulo = document.getElementById('titulo').value;
      const ubicacion = document.getElementById('ubicacion').value;
      const descripcion = document.getElementById('descripcion').value;
      const mapaUrl = document.getElementById('mapaUrl').value;

      let rutas = obtenerRutas();

      if (idExistente) {
        // ACTUALIZAR (UPDATE): Buscar la ruta por ID y modificar sus valores
        rutas = rutas.map(r => {
          if (r.id === idExistente) {
            return { id: idExistente, titulo, ubicacion, descripcion, mapaUrl };
          }
          return r;
        });
        alert('¡Ruta actualizada con éxito!');
      } else {
        // CREAR (CREATE): Agregar un nuevo objeto al arreglo
        const nuevaRuta = {
          id: "ruta-" + Date.now(),
          titulo,
          ubicacion,
          descripcion,
          mapaUrl
        };
        rutas.push(nuevaRuta);
        alert('¡Ruta creada con éxito!');
      }

      guardarRutas(rutas);
      resetearFormulario();
      cargarTabla();
    });

    // Preparar el formulario con los datos de la ruta elegida para editar
    window.prepararEdicion = function(id) {
      const rutas = obtenerRutas();
      const ruta = rutas.find(r => r.id === id);

      if (ruta) {
        document.getElementById('rutaId').value = ruta.id;
        document.getElementById('titulo').value = ruta.titulo;
        document.getElementById('ubicacion').value = ruta.ubicacion;
        document.getElementById('descripcion').value = ruta.descripcion;
        document.getElementById('mapaUrl').value = ruta.mapaUrl;

        // Cambiar textos visuales del panel
        document.getElementById('form-titulo').innerText = "Editar Ruta Existente";
        document.getElementById('btnAccion').innerText = "Actualizar Ruta";
        document.getElementById('btnCancelar').style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // --- ELIMINAR (DELETE) ---
    window.eliminarRuta = function(id) {
      if (confirm("¿Estás seguro de que deseas eliminar esta ruta?")) {
        let rutas = obtenerRutas();
        rutas = rutas.filter(r => r.id !== id);
        guardarRutas(rutas);
        cargarTabla();
        alert('¡Ruta eliminada con éxito!');
      }
    }

    // Limpiar el formulario y volver al modo "Crear"
    window.resetearFormulario = function() {
      document.getElementById('formRuta').reset();
      document.getElementById('rutaId').value = "";
      document.getElementById('form-titulo').innerText = "Añadir Nueva Ruta";
      document.getElementById('btnAccion').innerText = "Guardar Ruta";
      document.getElementById('btnCancelar').style.display = "none";
    }

    // Cargar la tabla al abrir la página
    document.addEventListener("DOMContentLoaded", cargarTabla);

    document.getElementById('btnExportar').addEventListener('click', () => {
    const rutas = obtenerRutas();
    
    // Convertir el arreglo de objetos a formato JSON legible
    const jsonString = JSON.stringify(rutas, null, 2);
    
    // Crear un archivo virtual temporal en el navegador
    const blob = new Blob([jsonString], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    
    // Crear un enlace invisible para forzar la descarga
    const a = document.createElement('a');
    a.href = url;
    a.download = "rutas.json"; // Nombre del archivo descargado
    document.body.appendChild(a);
    a.click();
    
    // Limpiar
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
});
  </script>
</body>
</html>
