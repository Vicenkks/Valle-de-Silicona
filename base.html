<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRuta</title>
    <link rel="stylesheet" href="06_starter.css">
</head>
<body>

    <header>
        <h1>EcoRuta</h1>
    </header>

    <main>

        <aside id="pronostico" style="width:400px;">
            <h2>Pronóstico</h2>
            <p>Consulta el clima antes de salir.</p>
            <img src="https://cdn2.iconfinder.com/data/icons/weather-flat-14/64/weather02-1024.png" alt="pronostico" width="200">
        </aside>

        <section id="rutas" style="order: -1;">
            <h2>Rutas</h2>
            <img src="https://d1xye9c95qvk7k.cloudfront.net/photos/08_BOSQUE_FRAY_JORGE/1.jpg" alt="Sendero natural rodeado de árboles" width="500">
            <p>Descubre los mejores senderos cerca de ti.</p>
        </section>

        <section id="eventos">
            <h2>Eventos</h2>
            <img src="https://images.pexels.com/photos/20184570/pexels-photo-20184570/free-photo-of-comida-hombres-mujer-sentado.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="pronostico" width="200">
            <p>Actividades y salidas grupales programadas.</p>
        </section>

        <section id="emprendimientos">
            <h2>Emprendimientos</h2>
            <p>Emprendedores locales que forman parte de la ruta.</p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 EcoRuta</p>
    </footer>

</body>
</html>
